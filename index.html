<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<!-- 1. Basic SEO Meta Tags -->
<title>3am News Station | Breaking News, Live Updates & Exclusive Footage</title>
<meta name="description" content="Your 24/7 source for Manhattan's latest breaking news, exclusive surveillance footage, and in-depth investigative reports. Stay ahead with 3am News Station.">
<link rel="canonical" href="https://3amnewsstation.com">

<!-- 2. Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://3amnewsstation.com">
<meta property="og:title" content="3am News Station | Breaking News & Live Updates">
<meta property="og:description" content="Stay informed with the latest headlines, exclusive video footage, and live coverage from the heart of Manhattan.">
<meta property="og:image" content="https://3amnewsstation.com/images/home-share-banner.jpg"> 
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="3am News Station">
<meta property="og:locale" content="en_US">

<!-- 3. Twitter Cards -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@3amnewsstation">
<meta name="twitter:title" content="3am News Station | Breaking News & Live Updates">
<meta name="twitter:description" content="Get the latest news and exclusive surveillance footage from Manhattan's most trusted 24-hour news source.">
<meta name="twitter:image" content="https://3amnewsstation.com/images/home-share-banner.jpg">

<!-- 4. Mobile & PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="3am News">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<meta name="theme-color" content="#1a1a1a">
</head>

</body>
</html>
