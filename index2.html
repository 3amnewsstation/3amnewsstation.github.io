<!-- 1. Basic SEO Meta Tags -->
<title>Your Page Title | Brand Name</title>
<meta name="description" content="Write a compelling summary of your page here (keep it under 160 characters).">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.yourdomain.com/this-page">

<!-- 2. Open Graph / Facebook (Also used by WhatsApp, LinkedIn, and Discord) -->
<meta property="og:type" content="website"> <!-- Use 'article' for blog posts -->
<meta property="og:url" content="https://www.yourdomain.com/this-page">
<meta property="og:title" content="A Catchy Title for Social Media">
<meta property="og:description" content="A brief description that hooks users when the link is shared on Facebook or WhatsApp.">
<meta property="og:image" content="https://www.yourdomain.com/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A descriptive text of the image for accessibility">
<meta property="og:site_name" content="Your Website Name">
<meta property="og:locale" content="en_US">

<!-- 3. Twitter Cards (Specific for Twitter/X) -->
<meta name="twitter:card" content="summary_large_image"> <!-- Options: summary, summary_large_image, app, player -->
<meta name="twitter:site" content="@owner_username">
<meta name="twitter:creator" content="@author_username">
<meta name="twitter:title" content="Custom Title for Twitter Feed">
<meta name="twitter:description" content="Short summary optimized for Twitter users.">
<meta name="twitter:image" content="https://www.yourdomain.com/images/og-image.jpg">

<!-- 4. Platform Verification (Optional) -->
<meta name="facebook-domain-verification" content="your-verification-code" />
<meta name="p:domain_verify" content="pinterest-verification-code"/>

<!-- 5. Mobile & App Meta Tags (iPhone/Android) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App Name">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<meta name="theme-color" content="#4A90E2">

<!-- 6. WhatsApp & Telegram Specifics -->
<meta property="og:image:secure_url" content="https://www.yourdomain.com/images/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
